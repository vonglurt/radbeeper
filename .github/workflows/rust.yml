# The native build, checked on every push that touches it.
#
# Deliberately not `cargo fmt --check`: the sources here are hand-set to a
# narrow column so the comments read as prose, and rustfmt would undo that.
# What is enforced is what actually reaches a user -- it compiles with no
# warnings, clippy finds nothing that is a bug, it builds against the
# committed lock file, the .crate that would be published builds on its own,
# and the rust-version in the manifest is a claim that is actually true.
name: rust

on:
  push:
    paths:
      - 'src/**'
      - 'examples/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      # The suite that holds the two implementations to each other, and the
      # reference they are held to. Left out until a test-only fix to a red
      # differential test pushed green and re-ran nothing, so the branch
      # stayed red on a failure that had already been fixed.
      - 'tests/**'
      - 'radbeeper'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'examples/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      # The suite that holds the two implementations to each other, and the
      # reference they are held to. Left out until a test-only fix to a red
      # differential test pushed green and re-ran nothing, so the branch
      # stayed red on a failure that had already been fixed.
      - 'tests/**'
      - 'radbeeper'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

# NOTHING THIS WORKFLOW DOES NEEDS TO WRITE ANYTHING. It builds, it tests, it
# compares two programs' bytes. Declared explicitly because the DEFAULT for a
# repository that has never set one is read-and-write on everything, and a
# token that can push is a token worth stealing -- which is the whole reason
# every action below is pinned to a commit rather than a tag somebody else can
# move.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build, with no warnings allowed
        run: cargo build --release --locked --all-targets
        env:
          RUSTFLAGS: -D warnings

      - run: cargo test --locked

      # correctness and suspicious only. The style groups have opinions about
      # line breaks that this file has already answered for itself.
      - name: Clippy, on the lints that mean a bug
        run: cargo clippy --all-targets --locked -- -D clippy::correctness -D clippy::suspicious

      - name: The published .crate builds from its own contents
        run: cargo package --locked

      # The port's safety rail: both implementations on the same input, and
      # the output compared character for character. It caught a %g that
      # rounded differently in the sixth significant figure on its first run.
      - name: The Rust and the Python write the same bytes
        run: python3 -m unittest discover -v -s tests

      # THE ONE DEPENDENCY, CHECKED. This crate has exactly one -- libc -- and
      # the whole argument for that is that a small surface can actually be
      # audited. Saying so and never looking would be worse than not saying
      # it, so the RustSec advisory database is checked on every run, for the
      # crate and for the window's several hundred alike.
      - name: No known advisories against anything this builds
        run: |
          cargo install cargo-audit --locked --quiet || true
          if command -v cargo-audit >/dev/null; then
            cargo audit --deny warnings
            (cd gui && cargo audit --deny warnings)
          else
            echo "cargo-audit unavailable; skipped"
          fi

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pin the toolchain to the rust-version the manifest promises
        run: |
          msrv=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)
          echo "rust-version is $msrv"
          rustup toolchain install "$msrv" --profile minimal
          rustup default "$msrv"
      - run: cargo build --release --locked

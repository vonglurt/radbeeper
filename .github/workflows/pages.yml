# Rebuild index.html from the logs in this repository, on every push that
# changes them.
#
# WHAT A FORK HAS TO DO: fork, copy your own cpm-<serial>-YYYY-MM.tsv files
# (and random-<serial>.tsv and sites.tsv, if you have them) into logs/, push.
# That is the whole of it.
# The pages are regenerated and committed back here, so they are servable from
# GitHub Pages with no build step and no artifact to expire. random.html is
# written only when there are emissions in logs/, so a fork with none gets one
# page and no broken link.
#
# The generator is the same one-file program the counter is read with, so the
# page cannot drift from the row format: a column added to the log is a column
# the export knows about in the same commit.
name: build the page

on:
  push:
    paths:
      - 'logs/**'
      - 'radbeeper'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No pip install, no requirements.txt, no lockfile: the program is one
      # stdlib Python file, which is the same reason it runs on a Pi Zero.
      - name: Build index.html and random.html
        run: python3 radbeeper export --logs logs -o index.html

      - name: Commit it if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          # Only when there were emissions to account for: a fork with no
          # random-*.tsv gets one page, and `git add` on a missing file is
          # an error rather than a no-op.
          [ -f random.html ] && git add random.html || true
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "rebuild index.html from logs/"
          git push

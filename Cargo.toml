[package]
name = "radbeeper"
version = "0.4.2"
edition = "2021"
authors = ["Paul Richeson <paulr@sdf.org>"]
rust-version = "1.70"
description = "A GQ GMC Geiger-Muller counter on the desk: find it, watch it, four time constants at once"
readme = "README.md"
license = "MIT"
documentation = "https://docs.rs/radbeeper"
repository = "https://github.com/vonglurt/radbeeper"
homepage = "https://github.com/vonglurt/radbeeper"
keywords = ["geiger", "radiation", "serial", "gmc", "tui"]
categories = ["command-line-utilities", "science"]
# An explicit list, so a stray file in the working tree can never end up in a
# published .crate. What ships is the sources, the manifest, the lock, the
# readme and the licence -- and `make package` prints exactly that.
#
# EVERY PATTERN IS ANCHORED WITH A LEADING SLASH. These are gitignore-style
# globs, so an unanchored "README.md" matches a README.md at ANY depth: it
# quietly pulled logs/README.md into the .crate, which is the exact stray
# file this list exists to keep out. "/README.md" is the root one and only it.
#
# AND IT IS A LIST OF PATTERNS, NOT A LIST OF LANGUAGES. This was
# "/src/**/*.rs" alone until the audit page grew a viewer, at which point
# src/frames.js -- pulled into the binary with include_str! -- was silently
# left out of the .crate. The crate still built here, because the file was on
# disk; it failed only in CI, building the PUBLISHED .crate from its own
# contents, which is the one check that sees the difference.
include = [
    "/src/**/*.rs",
    "/src/**/*.js",
    "/examples/*.rs",
    # The frame fixture and the test that reads it, so the PUBLISHED crate can
    # check its own wire format rather than taking this repository's word for
    # it. Four kilobytes, and without them cargo warns on every package that
    # it is ignoring a test it can see but cannot ship -- a warning that would
    # sit there until it was hiding a different one.
    "/tests/frames_fixture.rs",
    "/tests/fixtures/frames.bin",
    "/tests/fixtures/frames.json",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
]

[[bin]]
name = "radbeeper"
path = "src/main.rs"

# ONE DEPENDENCY, AND IT IS libc. A serial port is termios, and termios is
# libc; everything else here -- the FFT, the digits, the terminal drawing --
# is arithmetic and escape codes. The Python this was ported from has no
# dependencies at all, and the Rust is allowed exactly the one that a raw
# serial port cannot be written without.
[dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
